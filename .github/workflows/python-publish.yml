
name: AstroNumerica para Safari

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pygbag
        run: python -m pip install pygbag

      - name: Compilar juego web
        run: |
          python -m pygbag --build .

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar juego
        id: deployment
        uses: actions/deploy-pages@v4
